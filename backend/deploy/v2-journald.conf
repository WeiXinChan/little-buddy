# Dedicated namespace only; never install as journald.conf.
[Journal]
Storage=persistent
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
MaxRetentionSec=6day
MaxFileSec=1h
SystemMaxUse=32M
RuntimeMaxUse=8M
SystemMaxFileSize=4M
RuntimeMaxFileSize=1M
SystemMaxFiles=32
RuntimeMaxFiles=8
