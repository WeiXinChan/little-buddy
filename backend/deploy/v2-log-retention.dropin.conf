# Stable security overlay, retained across application rollback.
[Unit]
Requires=little-buddy-v2-log-retention.service little-buddy-v2-log-retention.timer
After=little-buddy-v2-log-retention.service

[Service]
LogNamespace=little-buddy-v2
SyslogIdentifier=little-buddy-v2
StandardOutput=journal
StandardError=journal
ExecStartPre=/usr/bin/python3 -B /opt/little-buddy-v2/log-policy/v2-log-retention.py check --namespace little-buddy-v2
