name: V2 eyes rendering
on:
  pull_request:
    paths: ['app/**', '.github/workflows/v2-eyes.yml']
permissions:
  contents: read
concurrency:
  group: v2-eyes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and render on API 36 x86_64
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          ./gradlew --no-daemon --max-workers=1 -Pv2Test -Pv2Emulator :app:testV2DebugUnitTest :app:assembleV2Debug :app:assembleV2DebugAndroidTest
          mkdir -p render
          git rev-parse HEAD > render/source.txt
          sha256sum app/build/outputs/apk/v2Debug/*.apk app/build/outputs/apk/androidTest/v2Debug/*.apk > render/apk-sha256.txt
          sudo -n apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=0 install -y --no-install-recommends libpulse0 pulseaudio pulseaudio-utils
          export ANDROID_AVD_HOME="$RUNNER_TEMP/v2-avd"
          mkdir -m 700 -p "$ANDROID_AVD_HOME"
          export PULSE_SERVER="unix:$ANDROID_AVD_HOME/pulse.sock"
          cat > "$ANDROID_AVD_HOME/pulse.pa" <<PULSE
          load-module module-native-protocol-unix socket=$ANDROID_AVD_HOME/pulse.sock auth-anonymous=1
          load-module module-null-sink sink_name=v2_playback
          set-default-sink v2_playback
          set-default-source v2_playback.monitor
          PULSE
          pulseaudio -n -F "$ANDROID_AVD_HOME/pulse.pa" --daemonize=no --exit-idle-time=-1 --use-pid-file=no >render/pulse.log 2>&1 &
          pulse_pid=$!
          emulator_pid=
          cleanup() {
            result=$?
            if ((result != 0)); then cat render/emulator.log render/pulse.log 2>/dev/null || true; fi
            adb emu kill || true
            if [[ -n "$emulator_pid" ]]; then kill -TERM "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" || true; fi
            kill "$pulse_pid" 2>/dev/null || true
            wait "$pulse_pid" || true
            exit "$result"
          }
          trap cleanup EXIT
          timeout 15s bash -c 'until pactl get-default-sink 2>/dev/null | grep -Fx v2_playback; do sleep 1; done'
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n v2eyes -k 'system-images;android-36;google_apis;x86_64' --force
          QEMU_AUDIO_DRV=pa "$ANDROID_HOME/emulator/emulator" -avd v2eyes -port 5554 -accel on -no-window -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics > render/emulator.log 2>&1 &
          emulator_pid=$!
          test -f "$ANDROID_AVD_HOME/v2eyes.ini"
          printf '%s\n' 'avdmanager/emulator use the same explicit ANDROID_AVD_HOME; v2eyes.ini exists' >render/avd-path-check.txt
          timeout 180s adb wait-for-device
          timeout 180s bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell wm size 1080x1920
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb install -g app/build/outputs/apk/v2Debug/app-v2Debug.apk
          adb install app/build/outputs/apk/androidTest/v2Debug/app-v2Debug-androidTest.apk
          adb shell pm path --user 0 com.littlebuddy.sim.v2 >render/package-before-reboot.txt
          # Existing regression setup requires a fresh AudioFlinger UID map.
          previous_boot=$(adb shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')
          export previous_boot
          adb reboot
          timeout 180s bash -c 'until [[ $(adb shell cat /proc/sys/kernel/random/boot_id 2>/dev/null | tr -d "\r") != "$previous_boot" && $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell getprop ro.build.version.sdk > render/api.txt
          adb shell getprop ro.product.cpu.abi > render/abi.txt
          adb shell pm path --user 0 com.littlebuddy.sim.v2 >render/package-after-reboot.txt
          adb shell am get-started-user-state 0 >render/user-before-unlock.txt
          adb shell dumpsys window policy | grep -E 'keyguard|Keyguard|mCurrentFocus' >render/window-before-unlock.txt || true
          adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.littlebuddy.sim.v2 >render/launcher-before-unlock.txt
          # Fresh test AVD has no secure credential; do not change lock settings.
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          timeout 30s bash -c 'until adb shell am get-started-user-state 0 | grep -q RUNNING_UNLOCKED; do sleep 1; done'
          adb shell am get-started-user-state 0 | tee render/user-after-unlock.txt
          adb shell dumpsys window policy | grep -E 'keyguard|Keyguard|mCurrentFocus' >render/window-after-unlock.txt || true
          adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.littlebuddy.sim.v2 | tee render/launcher.txt
          grep -q V2VoiceActivity render/launcher.txt
          adb shell am instrument -w -r -e class com.littlebuddy.V2EyesTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/instrumentation.txt
          adb exec-out run-as com.littlebuddy.sim.v2 tar -C files -cf - m06 > render/screens.tar
          tar -xf render/screens.tar -C render
          test "$(find render/m06 -name '*.png' | wc -l)" -eq 16
          python3 - <<'PYCODE'
          import pathlib, struct
          for path in pathlib.Path('render/m06').glob('*.png'):
              width, height = struct.unpack('>II', path.read_bytes()[16:24])
              assert width > height, (path.name, width, height)
              print(path.name, width, height)
          PYCODE
          sha256sum render/m06/*.png >render/screenshot-sha256.txt
          grep -q 'OK (1 test)' render/instrumentation.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-eyes-api36
          path: |
            render/
            app/build/test-results/testV2DebugUnitTest/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-eyes-emulator-apks
          path: |
            app/build/outputs/apk/v2Debug/*.apk
            app/build/outputs/apk/androidTest/v2Debug/*.apk
