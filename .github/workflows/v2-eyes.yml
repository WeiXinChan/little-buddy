name: V2 eyes rendering
on:
  pull_request:
    paths: ['app/**', 'scripts/m06/**', '.github/workflows/v2-eyes.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-eyes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14972612151'
          run-id: '45504346259'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b2-apks
      - name: Frozen b2 APK source7 SDK gate experiment on API 36 x86_64
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          git fetch --no-tags --depth=1 origin b2ccf61d3ef002aa0b43cc488627d21038f4fdfc
          mkdir -p render
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/m06/tests -v >render/host-script-tests.txt 2>&1
          # This authorized host-only experiment does not compile Android.
          python3 scripts/m06/reuse_b2_apks.py "$RUNNER_TEMP/b2-apks"
          unit_result=0
          printf '%s\n' 'NOT_RUN: frozen b2 APK experiment; prior JVM122=120PASS/2SKIP' >render/unit.txt
          printf '%s\n' '0' >render/unit-exit.txt
          git rev-parse HEAD > render/source.txt
          sha256sum app/build/outputs/apk/v2Debug/*.apk app/build/outputs/apk/androidTest/v2Debug/*.apk > render/apk-sha256.txt
          sudo -n apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=0 install -y --no-install-recommends libpulse0 pulseaudio pulseaudio-utils xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          export ANDROID_AVD_HOME="$RUNNER_TEMP/v2-avd"
          mkdir -m 700 -p "$ANDROID_AVD_HOME"
          export PULSE_SERVER="unix:$ANDROID_AVD_HOME/pulse.sock"
          cat > "$ANDROID_AVD_HOME/pulse.pa" <<PULSE
          load-module module-native-protocol-unix socket=$ANDROID_AVD_HOME/pulse.sock auth-anonymous=1
          load-module module-null-sink sink_name=v2_playback
          set-default-sink v2_playback
          load-module module-null-sink sink_name=m06_input
          set-default-source m06_input.monitor
          PULSE
          pulseaudio -n -F "$ANDROID_AVD_HOME/pulse.pa" --daemonize=no --exit-idle-time=-1 --use-pid-file=no >render/pulse.log 2>&1 &
          pulse_pid=$!
          export M06_PULSE_PID="$pulse_pid"
          emulator_pid=
          display_pid=
          cleanup() {
            result=$?
            if ((result != 0)); then cat render/emulator.log render/pulse.log 2>/dev/null || true; fi
            cleanup_error=0
            if [[ -n "$emulator_pid" ]]; then
              timeout 5s adb -s emulator-5554 shell run-as com.littlebuddy.sim.v2 find files/m06 -type f -name capture.s16le -print -delete >render/guest-pcm-final-cleanup.txt 2>&1 || cleanup_error=1
            fi
            timeout 8s adb -s emulator-5554 emu kill || true
            stop_owned() {
              owned_pid=$1
              [[ "$owned_pid" =~ ^[0-9]+$ ]] || return 0
              kill -TERM "$owned_pid" 2>/dev/null || true
              if ! timeout 5s bash -c 'while kill -0 "$1" 2>/dev/null; do sleep 0.2; done' _ "$owned_pid"; then
                kill -KILL "$owned_pid" 2>/dev/null || true
                if ! timeout 3s bash -c 'while kill -0 "$1" 2>/dev/null; do sleep 0.2; done' _ "$owned_pid"; then
                  printf 'owned child did not exit: %s\n' "$owned_pid" >>render/cleanup.txt
                  cleanup_error=1
                  return 0
                fi
              fi
              wait "$owned_pid" || true
            }
            if [[ -n "$emulator_pid" ]]; then stop_owned "$emulator_pid"; fi
            if [[ -n "$display_pid" ]]; then stop_owned "$display_pid"; fi
            stop_owned "$pulse_pid"
            if ((result == 0 && cleanup_error != 0)); then result=1; fi
            exit "$result"
          }
          trap cleanup EXIT
          timeout 15s bash -c 'until pactl get-default-sink 2>/dev/null | grep -Fx v2_playback; do sleep 1; done'
          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n v2eyes -k 'system-images;android-36;google_apis;x86_64' --force
          # -no-window selects a headless emulator whose PA implementation is a stub.
          # Keep the real GUI/audio backend on our private virtual display instead.
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/v2-runtime"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          export ANDROID_EMULATOR_HOME="$XDG_RUNTIME_DIR"
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp >render/xvfb.log 2>&1 &
          display_pid=$!
          timeout 10s bash -c 'until [[ -S /tmp/.X11-unix/X99 ]]; do sleep 0.2; done'
          export PULSE_SOURCE=m06_input.monitor PULSE_SINK=v2_playback
          export QEMU_PA_SERVER="$PULSE_SERVER" QEMU_PA_SOURCE=m06_input.monitor QEMU_PA_SINK=v2_playback
          "$ANDROID_HOME/emulator/emulator" -version >render/emulator-version.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd v2eyes -port 5554 -grpc 8554 -grpc-use-token -accel on -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics > render/emulator.log 2>&1 &
          emulator_pid=$!
          export M06_EMULATOR_PID="$emulator_pid"
          test -f "$ANDROID_AVD_HOME/v2eyes.ini"
          printf '%s\n' 'avdmanager/emulator use the same explicit ANDROID_AVD_HOME; v2eyes.ini exists' >render/avd-path-check.txt
          timeout 180s adb wait-for-device
          timeout 180s bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell wm size 1080x1920
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb install -g app/build/outputs/apk/v2Debug/app-v2Debug.apk
          adb install app/build/outputs/apk/androidTest/v2Debug/app-v2Debug-androidTest.apk
          adb shell pm path --user 0 com.littlebuddy.sim.v2 >render/package-before-reboot.txt
          # Existing regression setup requires a fresh AudioFlinger UID map.
          previous_boot=$(adb shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')
          export previous_boot
          adb reboot
          timeout 180s bash -c 'until [[ $(adb shell cat /proc/sys/kernel/random/boot_id 2>/dev/null | tr -d "\r") != "$previous_boot" && $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell getprop ro.build.version.sdk > render/api.txt
          adb shell getprop ro.product.cpu.abi > render/abi.txt
          adb shell pm path --user 0 com.littlebuddy.sim.v2 >render/package-after-reboot.txt
          adb shell am get-started-user-state 0 >render/user-before-unlock.txt
          adb shell dumpsys window policy | grep -E 'keyguard|Keyguard|mCurrentFocus' >render/window-before-unlock.txt || true
          adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.littlebuddy.sim.v2 >render/launcher-before-unlock.txt
          # Fresh test AVD has no secure credential; do not change lock settings.
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          timeout 30s bash -c 'until adb shell am get-started-user-state 0 | grep -q RUNNING_UNLOCKED; do sleep 1; done'
          adb shell am get-started-user-state 0 | tee render/user-after-unlock.txt
          adb shell dumpsys window policy | grep -E 'keyguard|Keyguard|mCurrentFocus' >render/window-after-unlock.txt || true
          adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.littlebuddy.sim.v2 | tee render/launcher.txt
          grep -q V2VoiceActivity render/launcher.txt
          # Phone-sized dp configuration: API36 otherwise ignores fixed orientation on large screens.
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell wm user-rotation lock 1
          # Fresh synthetic AVD only; acknowledge the OS one-time fullscreen tutorial.
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings get secure immersive_mode_confirmations >render/immersive-confirmation.txt
          grep -q '^confirmed' render/immersive-confirmation.txt
          adb shell wm size >render/display-size.txt
          adb shell wm density >render/display-density.txt
          adb shell wm user-rotation >render/display-rotation.txt
          adb emu avd hostmicoff >render/hostmic.txt
          test -f "$ANDROID_HOME/emulator/lib/emulator_controller.proto"
          cp "$ANDROID_HOME/emulator/lib/emulator_controller.proto" render/sdk-emulator_controller.proto
          cp "$ANDROID_HOME/emulator/source.properties" render/sdk-emulator-source.properties
          python3 -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --target "$RUNNER_TEMP/grpc-deps" grpcio-tools==1.78.0
          mkdir -p "$RUNNER_TEMP/grpc-generated"
          PYTHONPATH="$RUNNER_TEMP/grpc-deps" python3 -m grpc_tools.protoc -I "$ANDROID_HOME/emulator/lib" --python_out="$RUNNER_TEMP/grpc-generated" --grpc_python_out="$RUNNER_TEMP/grpc-generated" "$ANDROID_HOME/emulator/lib/emulator_controller.proto"
          export PYTHONPATH="$RUNNER_TEMP/grpc-deps:$RUNNER_TEMP/grpc-generated"
          pactl -f json list clients >render/pulse-clients-before-mic.json
          pactl -f json list source-outputs >render/pulse-source-outputs-before-mic.json
          device_result=0
          set +e
          BUDDY_SYNTHETIC_AVD_PROBE=1 M06_SDK_INPUT_GATE=1 M06_AUDIO_INPUT=grpc python3 scripts/m06/sdk_gate_calibration.py >render/microphone.txt 2>render/microphone-stderr.txt
          microphone_result=$?
          set -e
          printf '%s\n' "$microphone_result" >render/microphone-exit.txt
          cat render/microphone.txt
          if ((microphone_result != 0)); then device_result=1; fi
          adb shell am instrument -w -r -e class com.littlebuddy.V2BackpressureDeadlineTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/backpressure-deadline.txt || device_result=1
          grep -q 'OK (1 test)' render/backpressure-deadline.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2UploadHandoffTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/upload-handoff.txt || device_result=1
          grep -q 'OK (2 tests)' render/upload-handoff.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2KwsCommandTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/kws-boundary-v21.txt || device_result=1
          grep -q 'OK (2 tests)' render/kws-boundary-v21.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2CompletionLeaseTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/completion-lease.txt || device_result=1
          grep -q 'OK (2 tests)' render/completion-lease.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2PendingConnectionTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/pending-connection.txt || device_result=1
          grep -q 'OK (2 tests)' render/pending-connection.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2ModelResetTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/model-reset.txt || device_result=1
          grep -q 'OK (1 test)' render/model-reset.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2LocalPromptTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/local-prompt.txt || device_result=1
          grep -q 'OK (3 tests)' render/local-prompt.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2StopRaceTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/stop-race.txt || device_result=1
          grep -q 'OK (2 tests)' render/stop-race.txt || device_result=1
          adb shell am instrument -w -r -e class com.littlebuddy.V2EyesTest com.littlebuddy.sim.v2.test/com.littlebuddy.SimUiRunner | tee render/instrumentation.txt || device_result=1
          adb exec-out run-as com.littlebuddy.sim.v2 tar -C files -cf - m06 > render/screens.tar
          tar -xf render/screens.tar -C render
          # Only authorized synthetic capture files; export once, then purge AVD PCM.
          adb shell run-as com.littlebuddy.sim.v2 find files/m06 -type f -name capture.s16le -delete
          # Each arm was analyzed/exported before purging its guest PCM.
          test -f render/sdk-gate-calibration.json || device_result=1
          test "$(find render/m06 -name '[0-9][0-9]-*.png' | wc -l)" -eq 16
          python3 - <<'PYCODE'
          import pathlib, struct
          for path in pathlib.Path('render/m06').glob('[0-9][0-9]-*.png'):
              width, height = struct.unpack('>II', path.read_bytes()[16:24])
              assert width > height, (path.name, width, height)
              print(path.name, width, height)
          PYCODE
          sha256sum render/m06/*.png >render/screenshot-sha256.txt
          grep -q 'OK (1 test)' render/instrumentation.txt
          test "$device_result" -eq 0
          test "$unit_result" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-eyes-api36
          path: |
            render/
            app/build/test-results/testV2DebugUnitTest/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-eyes-emulator-apks
          path: |
            app/build/outputs/apk/v2Debug/*.apk
            app/build/outputs/apk/androidTest/v2Debug/*.apk

      - name: Remove synthetic PCM working copies after evidence export
        if: always()
        run: |
          if [[ -d render ]]; then
            find render -type f \( -name 'capture.s16le' -o -name 'mic-host-*.s16le' \) -delete
            rm -f render/screens.tar
          fi
