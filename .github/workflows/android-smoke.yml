name: Android emulator regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'app/**'
      - 'backend/**'
      - 'scripts/android-ci-*'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify runner and KVM
        run: |
          {
            echo "## Android emulator regression"
            echo "- Source: $(git rev-parse HEAD)"
            echo "- Runner: ubuntu-24.04 / $(uname -m), image ${ImageVersion:-unknown}"
            echo "- AVD image: $SYSTEM_IMAGE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Prepare virtual audio dependency
        run: |
          if ! command -v pulseaudio >/dev/null || ! command -v pactl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpulse0 pulseaudio pulseaudio-utils
          fi
          pulseaudio --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install SDK and verify acceleration
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' "$SYSTEM_IMAGE"
          {
            java -version
            python3 --version
            "$sdkmanager" --version
            printf '%s\n' 'SDK platform: 36; build tools: 35.0.0'
            "$ANDROID_HOME/platform-tools/adb" version
            "$ANDROID_HOME/emulator/emulator" -accel-check
            "$ANDROID_HOME/emulator/emulator" -version
            ./gradlew --no-daemon --version
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Backend and JVM checks and debug APKs
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install --no-cache-dir -r backend/requirements.txt
          PYTHONPATH=.:backend "$RUNNER_TEMP/smoke-venv/bin/python" -B -m unittest discover -s backend/tests
          echo "- Backend unittest passed" >> "$GITHUB_STEP_SUMMARY"
          export PATH="$RUNNER_TEMP/smoke-venv/bin:$PATH"
          export PYTHONPATH="$PWD:$PWD/backend"
          fixture_tls="$RUNNER_TEMP/animal-ci-tls"
          mkdir -m 700 "$fixture_tls"
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$fixture_tls/key.pem" -out "$fixture_tls/cert.pem"
          mkdir -p app/src/debug/res/raw
          cp "$fixture_tls/cert.pem" app/src/debug/res/raw/animal_ci_ca.pem
          sed -i '/<certificates src="user"/a\            <certificates src="@raw/animal_ci_ca" />' \
            app/src/debug/res/xml/voice_debug_network_security.xml
          ANIMAL_RELEASE_PROBE=1 ./gradlew --no-daemon \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          echo "- JVM debug unit tests (including TLS release probe) passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot, install and run smoke and game scenarios
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          serial=emulator-5554
          export ANDROID_AVD_HOME
          ANDROID_AVD_HOME="$(mktemp -d "$RUNNER_TEMP/smoke-avd.XXXXXX")"
          emulator_pid=
          pulse_pid=
          report() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          cleanup() {
            local result=$?
            if (( result != 0 )); then
              report "- Emulator step failed (exit $result)"
              if [[ -n "$emulator_pid" ]]; then
                timeout 5s "$adb" -s "$serial" logcat -d -s AndroidRuntime:E AudioTrack:E AudioFlinger:E AudioPolicyManager:E TestRunner:E | tail -60 || true
                tail -30 "$ANDROID_AVD_HOME/emulator.log" || true
              fi
            fi
            if [[ -n "$emulator_pid" ]]; then
              timeout 5s "$adb" -s "$serial" emu kill >/dev/null 2>&1 || true
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
            fi
            if [[ -n "$pulse_pid" ]]; then
              kill "$pulse_pid" 2>/dev/null || true
              wait "$pulse_pid" 2>/dev/null || true
            fi
            rm -rf -- "$ANDROID_AVD_HOME"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "$SYSTEM_IMAGE"
          # The guest gets a real playback route. The host sink discards PCM and
          # its monitor provides a synthetic source, with no host mic configured.
          export PULSE_SERVER="unix:$ANDROID_AVD_HOME/pulse.sock"
          cat >"$ANDROID_AVD_HOME/pulse.pa" <<PULSE
          load-module module-native-protocol-unix socket=$ANDROID_AVD_HOME/pulse.sock auth-anonymous=1
          load-module module-null-sink sink_name=smoke_playback
          set-default-sink smoke_playback
          set-default-source smoke_playback.monitor
          PULSE
          chmod 700 "$ANDROID_AVD_HOME"
          pulseaudio -n -F "$ANDROID_AVD_HOME/pulse.pa" --daemonize=no --exit-idle-time=-1 \
            --use-pid-file=no >"$ANDROID_AVD_HOME/pulse.log" 2>&1 &
          pulse_pid=$!
          audio_ready=
          for attempt in {1..10}; do
            if timeout 2s pactl get-default-sink 2>/dev/null | grep -Fx smoke_playback; then
              audio_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$audio_ready" != 1 ]]; then
            tail -20 "$ANDROID_AVD_HOME/pulse.log"
            exit 1
          fi
          report "- Host audio: PulseAudio virtual sink and monitor"
          start=$SECONDS
          QEMU_AUDIO_DRV=pa "$emulator" -avd smoke -port 5554 -accel on -no-window -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect -no-metrics >"$ANDROID_AVD_HOME/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=
          while (( SECONDS - start < 240 )) && kill -0 "$emulator_pid" 2>/dev/null; do
            if [[ "$(timeout 5s "$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          report "- Boot elapsed: $((SECONDS - start))s"
          test "$booted" = 1
          api="$(timeout 10s "$adb" -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$(timeout 10s "$adb" -s "$serial" shell getprop ro.product.cpu.abi | tr -d '\r')"
          report "- Booted API: $api / ABI: $abi"
          test "$api" = 36 && test "$abi" = x86_64

          start=$SECONDS
          install_status=0
          timeout 60s "$adb" -s "$serial" install -g app/build/outputs/apk/debug/app-debug.apk &&
            timeout 60s "$adb" -s "$serial" install -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ||
            install_status=$?
          report "- APK install elapsed: $((SECONDS - start))s"
          test "$install_status" = 0

          scripts/android-ci-instrument "$serial" "$ANDROID_AVD_HOME"
