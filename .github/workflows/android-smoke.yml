name: Android emulator regression

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'app/**'
      - 'backend/**'
      - 'scripts/android-ci-*'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify runner and KVM
        run: |
          {
            echo "## Android emulator regression"
            echo "- Source: $(git rev-parse HEAD)"
            echo "- Runner: ubuntu-24.04 / $(uname -m), image ${ImageVersion:-unknown}"
            echo "- AVD image: $SYSTEM_IMAGE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "::notice::Source $(git rev-parse HEAD), standard ubuntu-24.04 / $(uname -m), /dev/kvm readable and writable"

      - name: Prepare virtual audio dependency
        timeout-minutes: 12
        run: |
          audio_available() {
            command -v pulseaudio >/dev/null && command -v pactl >/dev/null &&
              dpkg-query -W -f='${db:Status-Status}\n' libpulse0 pulseaudio pulseaudio-utils |
                awk '$0 != "installed" { invalid = 1 } END { exit (NR != 3 || invalid) }'
          }
          if ! audio_available; then
            apt=(sudo -n apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
              -o Acquire::Retries=0 -o DPkg::Lock::Timeout=10)
            packages=(libpulse0 pulseaudio pulseaudio-utils)
            install_args=(install -y --no-install-recommends "${packages[@]}")
            echo 'PulseAudio download attempt 1/2 using runner indexes'
            if ! timeout --kill-after=5s 120s "${apt[@]}" --download-only "${install_args[@]}"; then
              sleep 3
              echo 'PulseAudio download attempt 2/2 using Ubuntu archive'
              source_file="$RUNNER_TEMP/audio-ubuntu.sources"
              cat >"$source_file" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
              apt+=(-o "Dir::Etc::sourcelist=$source_file" -o Dir::Etc::sourceparts=-)
              if ! timeout --kill-after=5s 155s "${apt[@]}" -o APT::Update::Error-Mode=any \
                -o Acquire::Languages=none -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
                -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false update; then
                echo '::error::PulseAudio dependency setup failed while refreshing Ubuntu package indexes'
                exit 1
              fi
              if ! timeout --kill-after=5s 120s "${apt[@]}" --download-only "${install_args[@]}"; then
                echo '::error::PulseAudio package download failed after two attempts'
                exit 1
              fi
            fi

            # Downloads cannot consume the time reserved for unpacking and configuring.
            if ! timeout --kill-after=10s 150s "${apt[@]}" --no-download "${install_args[@]}"; then
              echo 'PulseAudio offline install interrupted or failed; attempting one dpkg recovery'
              if ! timeout --kill-after=10s 90s sudo -n dpkg --configure -a || ! audio_available; then
                echo '::error::PulseAudio installation incomplete after dpkg recovery'
                exit 1
              fi
            fi
          fi
          audio_available
          { pulseaudio --version; pactl --version; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install SDK and verify acceleration
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' "$SYSTEM_IMAGE"
          {
            java -version
            python3 --version
            "$sdkmanager" --version
            printf '%s\n' 'SDK platform: 36; build tools: 35.0.0'
            "$ANDROID_HOME/platform-tools/adb" version
            "$ANDROID_HOME/emulator/emulator" -accel-check
            "$ANDROID_HOME/emulator/emulator" -version
            ./gradlew --no-daemon --version
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Backend and JVM checks and debug APKs
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install --no-cache-dir -r backend/requirements.txt
          PYTHONPATH=.:backend "$RUNNER_TEMP/smoke-venv/bin/python" -B -m unittest discover -s backend/tests
          echo "::notice::Backend unittest passed"
          echo "- Backend unittest passed" >> "$GITHUB_STEP_SUMMARY"
          export PATH="$RUNNER_TEMP/smoke-venv/bin:$PATH"
          export PYTHONPATH="$PWD:$PWD/backend"
          fixture_tls="$RUNNER_TEMP/animal-ci-tls"
          mkdir -m 700 "$fixture_tls"
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$fixture_tls/key.pem" -out "$fixture_tls/cert.pem"
          mkdir -p app/src/debug/res/raw
          cp "$fixture_tls/cert.pem" app/src/debug/res/raw/animal_ci_ca.pem
          sed -i '/<certificates src="user"/a\            <certificates src="@raw/animal_ci_ca" />' \
            app/src/debug/res/xml/voice_debug_network_security.xml
          ANIMAL_RELEASE_PROBE=1 ./gradlew --no-daemon \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from xml.etree import ElementTree

          probe = "com.littlebuddy.GameReleaseIntegrationTest"
          suite = ElementTree.parse(f"app/build/test-results/testDebugUnitTest/TEST-{probe}.xml")
          cases = suite.findall(
              f"./testcase[@classname='{probe}'][@name='ackCanTraverseTheSocketWhileTheNextSegmentHasNoConsumer']"
          )
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          if len(cases) != 1 or skipped or failed:
              raise SystemExit(f"Unexpected TLS release probe result: {len(cases)} recorded, {skipped} skipped, {failed} failed")
          print(f"- JVM TLS release probe: {len(cases) - skipped}/1 executed, {failed} failed, {skipped} skipped")
          PY
          echo "::notice::JVM debug unit tests including TLS release probe and debug APK builds passed"
          echo "- JVM debug unit tests (including TLS release probe) passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot, install and run smoke and game scenarios
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          serial=emulator-5554
          export ANDROID_AVD_HOME
          ANDROID_AVD_HOME="$(mktemp -d "$RUNNER_TEMP/smoke-avd.XXXXXX")"
          emulator_pid=
          adb_pid=
          pulse_pid=
          instrument_pid=
          ulimit -c 0
          export ANDROID_ADB_SERVER_PORT=15037
          export ADB_SERVER_SOCKET="tcp:localhost:$ANDROID_ADB_SERVER_PORT"
          report() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          stop_process() {
            local target=$1
            for attempt in {1..20}; do
              kill -0 -- "$target" 2>/dev/null || return 0
              sleep 0.2
            done
            kill -TERM -- "$target" 2>/dev/null || true
            for attempt in {1..10}; do
              kill -0 -- "$target" 2>/dev/null || return 0
              sleep 0.2
            done
            kill -KILL -- "$target" 2>/dev/null || true
            return 1
          }
          cleanup() {
            local result=$?
            if [[ -n "$instrument_pid" ]]; then
              kill -TERM "$instrument_pid" 2>/dev/null || true
            fi
            if (( result != 0 )); then
              report "- Emulator step failed (exit $result)"
              if [[ -n "$emulator_pid" ]]; then
                timeout 5s "$adb" -s "$serial" logcat -d -s AndroidRuntime:E AudioTrack:E AudioFlinger:E AudioPolicyManager:E TestRunner:E | tail -60 || true
                tail -30 "$ANDROID_AVD_HOME/emulator.log" || true
              fi
            fi
            if [[ -n "$emulator_pid" ]]; then
              timeout 5s "$adb" -s "$serial" emu kill >/dev/null 2>&1 || true
              stop_process "-$emulator_pid" || { report "- Emulator required SIGKILL"; result=1; }
              wait "$emulator_pid" 2>/dev/null || true
            fi
            if [[ -n "$instrument_pid" ]]; then
              wait "$instrument_pid" 2>/dev/null || true
            fi
            if [[ -n "$adb_pid" ]]; then
              kill -TERM "$adb_pid" 2>/dev/null || true
              stop_process "$adb_pid" || { report "- ADB required SIGKILL"; result=1; }
              wait "$adb_pid" 2>/dev/null || true
            fi
            if [[ -n "$pulse_pid" ]]; then
              kill -TERM "$pulse_pid" 2>/dev/null || true
              stop_process "$pulse_pid" || { report "- PulseAudio required SIGKILL"; result=1; }
              wait "$pulse_pid" 2>/dev/null || true
            fi
            rm -rf -- "$ANDROID_AVD_HOME"
            if (( result == 0 )); then
              report "- Emulator, ADB and PulseAudio cleanup completed"
              echo "::notice::API $api / $abi. Emulator, ADB and PulseAudio cleanup completed"
            fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "$SYSTEM_IMAGE"
          # The guest gets a real playback route. The host sink discards PCM and
          # its monitor provides a synthetic source, with no host mic configured.
          export PULSE_SERVER="unix:$ANDROID_AVD_HOME/pulse.sock"
          cat >"$ANDROID_AVD_HOME/pulse.pa" <<PULSE
          load-module module-native-protocol-unix socket=$ANDROID_AVD_HOME/pulse.sock auth-anonymous=1
          load-module module-null-sink sink_name=smoke_playback
          set-default-sink smoke_playback
          set-default-source smoke_playback.monitor
          PULSE
          chmod 700 "$ANDROID_AVD_HOME"
          pulseaudio -n -F "$ANDROID_AVD_HOME/pulse.pa" --daemonize=no --exit-idle-time=-1 \
            --use-pid-file=no >"$ANDROID_AVD_HOME/pulse.log" 2>&1 &
          pulse_pid=$!
          audio_ready=
          for attempt in {1..10}; do
            if timeout 2s pactl get-default-sink 2>/dev/null | grep -Fx smoke_playback; then
              audio_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$audio_ready" != 1 ]]; then
            tail -20 "$ANDROID_AVD_HOME/pulse.log"
            exit 1
          fi
          report "- Host audio: PulseAudio virtual sink and monitor"

          # Use an owned foreground ADB server and an emulator process group so
          # teardown has handles for the child processes even on failure.
          adb_listener() { ss -Hlt "sport = :$ANDROID_ADB_SERVER_PORT"; }
          test -z "$(adb_listener)"
          "$adb" -P "$ANDROID_ADB_SERVER_PORT" nodaemon server \
            >"$ANDROID_AVD_HOME/adb.log" 2>&1 &
          adb_pid=$!
          for attempt in {1..20}; do
            kill -0 "$adb_pid" 2>/dev/null || break
            if [[ -n "$(adb_listener)" ]]; then
              break
            fi
            sleep 0.25
          done
          if ! kill -0 "$adb_pid" 2>/dev/null || [[ -z "$(adb_listener)" ]]; then
            tail -20 "$ANDROID_AVD_HOME/adb.log"
            exit 1
          fi

          start=$SECONDS
          QEMU_AUDIO_DRV=pa setsid "$emulator" -avd smoke -port 5554 -accel on -no-window -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect -no-metrics >"$ANDROID_AVD_HOME/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=
          while (( SECONDS - start < 240 )) && kill -0 "$emulator_pid" 2>/dev/null; do
            if [[ "$(timeout 5s "$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          report "- Boot elapsed: $((SECONDS - start))s"
          test "$booted" = 1
          api="$(timeout 10s "$adb" -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$(timeout 10s "$adb" -s "$serial" shell getprop ro.product.cpu.abi | tr -d '\r')"
          report "- Booted API: $api / ABI: $abi"
          test "$api" = 36
          test "$abi" = x86_64

          start=$SECONDS
          install_status=0
          timeout 60s "$adb" -s "$serial" install -g app/build/outputs/apk/debug/app-debug.apk &&
            timeout 60s "$adb" -s "$serial" install -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ||
            install_status=$?
          report "- APK install elapsed: $((SECONDS - start))s"
          test "$install_status" = 0

          scripts/android-ci-instrument "$serial" "$ANDROID_AVD_HOME" &
          instrument_pid=$!
          instrument_status=0
          wait "$instrument_pid" || instrument_status=$?
          instrument_pid=
          exit "$instrument_status"
